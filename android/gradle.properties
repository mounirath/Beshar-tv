# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# in your personal ~/.gradle/gradle.properties.

# JVM Arguments for optimal build performance in CI (GitHub Actions) and local IDE
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX Support
# Required by Android Gradle Plugin (AGP) when using AndroidX dependencies (Jetpack Compose, Media3, Lifecycle, etc.)
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R class enables namespacing of each library's R class so that its R class includes only the resources declared in the library itself
android.nonTransitiveRClass=true

# Kotlin official code style
kotlin.code.style=official
